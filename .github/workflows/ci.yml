name: CI Check

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: https://emluqkhsrvtoejmuzsjw.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_62wZYraBhX6m8VGpXmm6LQ_vcCzdIJS
          VITE_API_URL: http://localhost:8000
        run: npm run build

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check backend import
        working-directory: backend
        run: |
          python -c "import app.main; print('Backend syntax and imports OK!')"
