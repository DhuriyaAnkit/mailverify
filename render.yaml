services:
  - type: web
    name: mailverify-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000
      - key: ALLOWED_ORIGIN_REGEX
        value: https://.*\.vercel\.app
